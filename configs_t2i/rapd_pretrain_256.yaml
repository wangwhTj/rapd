# Release copy: training settings preserved; checkpoint paths are relative.
seed_everything: true
tags:
  exp: &exp rapd_pretrain_256
torch_hub_dir: ./pretrain_weights/torch_hub
huggingface_cache_dir: null

trainer:
  default_root_dir: ./rapd_work_dir
  accumulate_grad_batches: 1
  max_steps: 300000
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  val_check_interval: 20000
  log_every_n_steps: 50
  save_every_n_steps: 20000
  save_last: true
  callbacks:
    - class_path: src.callbacks.save_images.SaveImagesHook
      init_args:
        save_dir: val

model:
  ae_ckpt: ./checkpoints/window_att_ae_sr/best.pt
  decode_size: 256
  decode_overscan_pad: 8

  ae:
    class_path: src.models.autoencoder.cqar_ae.CQARAutoencoder
    init_args:
      feat_channels: 16
      hidden: 256
      stats_path: ./checkpoints/window_att_ae_sr/ae_stats.pt
      ae_ckpt: ./checkpoints/window_att_ae_sr/best.pt
      renderer_block_type: window_attention
      renderer_num_blocks: 4
      renderer_num_heads: 4
      renderer_ffn_expansion_factor: 2.0
      renderer_window_size: 8

  denoiser:
    class_path: src.models.transformer.JiT_T2I.JiT_T2I
    init_args:
      in_channels: 16
      patch_size: 16
      input_size: 256
      hidden_size: &hidden_dim 1536
      num_blocks: 16
      num_groups: 24
      txt_embed_dim: &txt_embed_dim 2048
      txt_max_length: 128
      bottleneck_dim: 1024
      num_text_blocks: 4
      gated_attn: true

  conditioner:
    class_path: src.models.conditioner.qwen3_text_encoder.Qwen3TextEncoder
    init_args:
      weight_path: ./pretrain_weights/Qwen3-1.7B
      embed_dim: *txt_embed_dim
      max_length: 128

  diffusion_trainer:
    class_path: src.diffusion.flow_matching.training_rapd.RaPDTrainer
    init_args:
      feat_loss_weight: 0.5
      lognorm_t: true
      encoder:
        class_path: src.models.encoder.DINOv2
        init_args:
          weight_path: ./pretrain_weights/torch_hub/checkpoints/dinov2_vitb14_pretrain.pth
      align_layer: 8
      proj_denoiser_dim: *hidden_dim
      proj_hidden_dim: *hidden_dim
      proj_encoder_dim: 768
      P_mean: 0.0
      P_std: 1.0
      timeshift: 16.0 # new
      t_eps: 1e-8 # recheck
      scheduler: &scheduler src.diffusion.flow_matching.scheduling.LinearScheduler

  diffusion_sampler:
    class_path: src.diffusion.flow_matching.sampling.EulerSamplerJiT
    init_args:
      num_steps: 100
      guidance: 4.0
      scheduler: *scheduler
      w_scheduler: src.diffusion.flow_matching.scheduling.LinearScheduler
      guidance_fn: src.diffusion.base.guidance.simple_guidance_fn
      step_fn: src.diffusion.flow_matching.sampling.ode_step_fn
      timeshift: 16.0 # new ?

  ema_tracker:
    class_path: src.callbacks.simple_ema.SimpleEMA
    init_args:
      decay: 0.9999

  optimizer:
    class_path: torch.optim.AdamW
    init_args:
      lr: 2e-4 # recheck
      betas:
        - 0.9
        - 0.95
      weight_decay: 0.00

data:
  train_dataset:
    class_path: src.data.dataset.blip3o_dataset.WebDatasetPackedDataset
    init_args:
      urls:
        - ./datasets/BLIP3o/BLIP3o-Pretrain-Long-Caption
        - ./datasets/BLIP3o/BLIP3o-Pretrain-Short-Caption
        - ./datasets/BLIP3o/BLIP3o-Pretrain-JourneyDB
      resolution: 256
      random_crop: false
      shuffle_buffer: 20000
      sample_shuffle: true
      repeat: true

  eval_dataset:
    class_path: src.data.dataset.geneval.GenEvalDataset
    init_args:
      meta_json_path: ./evaluations/geneval/evaluation_metadata.jsonl
      num_samples_per_instance: 4
      latent_shape:
        - 16
        - 256
        - 256

  pred_dataset:
    class_path: src.data.dataset.geneval.GenEvalDataset
    init_args:
      meta_json_path: ./evaluations/geneval/evaluation_metadata.jsonl
      num_samples_per_instance: 4
      latent_shape:
        - 16
        - 256
        - 256

  train_batch_size: 192
  train_num_workers: 8
  eval_batch_size: 8
  eval_num_workers: 4
  pred_batch_size: 8
  pred_num_workers: 1
